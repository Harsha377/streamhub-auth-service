server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/streamhub_auth
    username: postgres
    password: Harsha
  jpa:
    hibernate:
      ddl-auto: validate
  open-in-view: false
  properties:
    hibernate:
      format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


logging:
  level:
    root: INFO

  output:
    ansi:
      enabled: true

app:
  mail:
    from: ${MAIL_USERNAME}
    from-name: StreamHub
    application-name: StreamHub Authentication
    otp-validity-minutes: 5
  otp:
    length: 6
    expiry-minutes: 5


jwt:
  secret: ${JWT_SECRET}
  issuer: streamhub-auth
  access-token-expiry: 900000
  refresh-token-expiry: 2592000000

cookie:
  domain: localhost
  secure: false
  http-only: true
  same-site: Lax

session:
  cleanup:
    cron: "0 0 * * * *"